<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#F5F2EC" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="研习台" />
<meta name="format-detection" content="telephone=no" />
<title>研习台 · 科研与生活工作台</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="app">

  <!-- ============ 桌面侧栏 ============ -->
  <aside class="rail">
    <div class="rail-brand">
      <div class="rail-logo">研</div>
      <div class="rail-brand-text">
        <strong>研习台</strong>
        <span>科研 · 生活</span>
      </div>
    </div>
    <nav class="rail-nav" id="railNav">
      <button class="rail-item is-active" data-nav="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
        <span>首页</span>
      </button>
      <button class="rail-item" data-nav="research">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 12h7M9 16h5"/></svg>
        <span>科研</span>
      </button>
      <button class="rail-item" data-nav="life">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.35-7-9.5A3.5 3.5 0 0 1 12 8a3.5 3.5 0 0 1 7 2.5C19 15.65 12 20 12 20z"/></svg>
        <span>生活</span>
      </button>
      <button class="rail-item" data-nav="review">
        <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 16V11M12.5 16V7M17 16v-6"/></svg>
        <span>回顾</span>
      </button>
    </nav>
    <div class="rail-foot">
      <button class="rail-mini" id="railTheme" title="深浅色切换">
        <svg viewBox="0 0 24 24"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>
      </button>
      <button class="rail-mini" id="railSettings" title="数据与设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="main">

    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-date" id="topDate">—</div>
        <h1 class="topbar-title" id="topTitle">今天</h1>
      </div>
      <div class="topbar-right">
        <span class="sync-badge sync--off" id="syncBadge" title="未开启云端同步">未同步</span>
        <button class="icon-btn" id="topTheme" title="深浅色切换">
          <svg viewBox="0 0 24 24"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"/></svg>
        </button>
        <button class="icon-btn" id="topSettings" title="数据与设置">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
        </button>
      </div>
    </header>

    <div class="scroll" id="scrollArea">

      <!-- ==================== 首页 ==================== -->
      <section class="page is-active" id="page-home">

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">待办</div>
            <div class="stat-value" id="statTodo">0</div>
            <div class="stat-sub" id="statTodoSub">今日安排</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">已完成</div>
            <div class="stat-value accent-green" id="statDone">0</div>
            <div class="stat-sub">已勾选</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">未完成</div>
            <div class="stat-value accent-clay" id="statUndone">0</div>
            <div class="stat-sub" id="statOverdue">无逾期</div>
          </div>
          <div class="stat-card stat-card--ring">
            <div>
              <div class="stat-label">完成率</div>
              <div class="stat-value" id="statRate">0%</div>
              <div class="stat-sub">今日进度</div>
            </div>
            <svg class="ring" viewBox="0 0 44 44">
              <circle class="ring-bg" cx="22" cy="22" r="18" />
              <circle class="ring-fg" cx="22" cy="22" r="18" id="ringFg" />
            </svg>
          </div>
        </div>

        <!-- 站内可编辑日历 -->
        <div class="card card--cal">
          <div class="card-head">
            <h2>日历</h2>
            <div class="card-tools">
              <button class="ghost-btn" id="calPrev" title="上一月">‹</button>
              <span class="chip-mini" id="calMonthLabel">—</span>
              <button class="ghost-btn" id="calNext" title="下一月">›</button>
              <button class="soft-btn soft-btn--quiet" id="calToday">今天</button>
              <label class="soft-btn soft-btn--quiet" title="从 .ics 导入里程碑">.ics<input type="file" id="icsInput" accept=".ics,text/calendar" hidden /></label>
            </div>
          </div>
          <div class="cal-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-detail" id="calDetail"></div>
        </div>

        <!-- 今日科研微区 -->
        <div class="card">
          <div class="card-head">
            <h2>今日科研</h2>
            <button class="ghost-btn" data-goto="research">去科研页</button>
          </div>
          <div id="todayResearch" class="today-research"></div>
          <div class="quick-inspire">
            <input id="inspireInput" class="mini-input mini-input--grow" placeholder="随手记一条灵感 / 选题…" />
            <button class="soft-btn soft-btn--solid" id="inspireSave">记一笔</button>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>任务</h2>
            <div class="card-tools">
              <div class="seg" id="taskFilter">
                <button class="is-active" data-tf="today">今天</button>
                <button data-tf="week">本周</button>
                <button data-tf="all">全部</button>
              </div>
              <button class="soft-btn" id="addTaskBtn">＋ 新增</button>
            </div>
          </div>
          <div id="taskList" class="list"></div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-head">
              <h2>临近截止</h2>
              <button class="ghost-btn" data-goto="research">去科研页</button>
            </div>
            <div id="deadlineList" class="list list--tight"></div>
          </div>

          <div class="card">
            <div class="card-head">
              <h2>灵感收集箱</h2>
              <div class="card-tools">
                <span class="chip-mini" id="inboxCount">0 条</span>
                <button class="ghost-btn" id="inboxMoreBtn">全部</button>
              </div>
            </div>
            <div id="inboxList" class="list list--tight"></div>
          </div>
        </div>

      </section>

      <!-- ==================== 科研 ==================== -->
      <section class="page" id="page-research">

        <div class="card card--paper">
          <div class="card-head">
            <h2>顶刊每日推荐</h2>
            <div class="card-tools">
              <span class="chip-mini" id="paperDate">—</span>
              <div class="seg" id="paperMode">
                <button class="is-active" data-pm="live">最新</button>
                <button data-pm="seed">经典</button>
              </div>
              <button class="soft-btn soft-btn--quiet" id="paperShuffle">换一组</button>
              <button class="soft-btn soft-btn--quiet" id="paperRefresh">刷新</button>
            </div>
          </div>
          <div id="paperDaily" class="paper-wrap"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>论文追踪</h2>
            <div class="card-tools">
              <div class="seg" id="paperTrackFilter">
                <button class="is-active" data-ptf="active">进行中</button>
                <button data-ptf="archived">已归档</button>
                <button data-ptf="all">全部</button>
              </div>
              <button class="soft-btn" id="addPaperBtn">＋ 新建论文</button>
            </div>
          </div>
          <div id="paperTrackList" class="track-wrap"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>项目追踪</h2>
            <div class="card-tools">
              <div class="seg" id="projTrackFilter">
                <button class="is-active" data-prf="active">进行中</button>
                <button data-prf="archived">已归档</button>
                <button data-prf="all">全部</button>
              </div>
              <button class="soft-btn" id="addProjBtn">＋ 新建项目</button>
            </div>
          </div>
          <div id="projTrackList" class="track-wrap"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>研究方向</h2>
            <div class="card-tools">
              <span class="chip-mini" id="dirCount">0 个</span>
              <button class="soft-btn" id="addDirBtn">＋ 新建方向</button>
            </div>
          </div>
          <div id="dirList" class="dir-wrap"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>研读笔记</h2>
            <div class="card-tools">
              <span class="chip-mini" id="noteCount">0 条</span>
              <button class="soft-btn" id="addNoteBtn">＋ 写笔记</button>
            </div>
          </div>
          <div id="noteList" class="list list--tight"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>成果档案</h2>
            <div class="card-tools">
              <span class="chip-mini" id="archCount">0 项</span>
              <button class="soft-btn" id="addAchBtn">＋ 手动添加</button>
              <button class="ghost-btn" id="archExport">导出清单</button>
            </div>
          </div>
          <div class="ach-stats" id="achStats"></div>
          <div id="archList" class="list list--tight"></div>
        </div>

      </section>

      <!-- ==================== 生活 ==================== -->
      <section class="page" id="page-life">

        <div class="seg seg--wide" id="lifeTabs">
          <button class="is-active" data-life="sport">运动</button>
          <button data-life="media">阅读观影</button>
          <button data-life="travel">旅行</button>
          <button data-life="habit">习惯</button>
        </div>

        <!-- 运动 -->
        <div class="life-panel is-active" id="life-sport">
          <div class="stat-grid stat-grid--3">
            <div class="stat-card"><div class="stat-label">本月次数</div><div class="stat-value" id="spCount">0</div><div class="stat-sub">运动记录</div></div>
            <div class="stat-card"><div class="stat-label">本月时长</div><div class="stat-value" id="spMin">0</div><div class="stat-sub">分钟</div></div>
            <div class="stat-card"><div class="stat-label">连续天数</div><div class="stat-value" id="spStreak">0</div><div class="stat-sub">最近坚持</div></div>
          </div>
          <div class="card">
            <div class="card-head"><h2>运动记录</h2><button class="soft-btn" id="addSportBtn">＋ 新增</button></div>
            <div id="sportList" class="list list--tight"></div>
          </div>
        </div>

        <!-- 阅读观影 -->
        <div class="life-panel" id="life-media">
          <div class="grid-2">
            <div class="card">
              <div class="card-head"><h2>阅读</h2><span class="chip-mini" id="bookDeepHint">深度阅读</span><button class="soft-btn" id="addBookBtn">＋ 新增</button></div>
              <div id="bookList" class="list list--tight"></div>
            </div>
            <div class="card">
              <div class="card-head"><h2>观影</h2><button class="soft-btn" id="addMovieBtn">＋ 新增</button></div>
              <div id="movieList" class="list list--tight"></div>
            </div>
          </div>
        </div>

        <!-- 旅行 -->
        <div class="life-panel" id="life-travel">
          <div class="card">
            <div class="card-head"><h2>旅行计划</h2><button class="soft-btn" id="addTripBtn">＋ 新增</button></div>
            <div id="tripList" class="trip-wrap"></div>
          </div>
        </div>

        <!-- 习惯 -->
        <div class="life-panel" id="life-habit">
          <div class="card">
            <div class="card-head"><h2>习惯打卡</h2><button class="soft-btn" id="addHabitBtn">＋ 新增习惯</button></div>
            <div id="habitList" class="habit-wrap"></div>
          </div>
        </div>

      </section>

      <!-- ==================== 回顾 ==================== -->
      <section class="page" id="page-review">
        <div class="seg seg--wide seg--3" id="reviewRange">
          <button data-rr="week" class="is-active">本周</button>
          <button data-rr="month">本月</button>
          <button data-rr="year">本年</button>
        </div>

        <div class="card card--quote">
          <div class="quote-label">阶段小结</div>
          <p id="reviewSummary" class="quote-text">—</p>
        </div>

        <div class="card">
          <div class="card-head"><h2>任务完成情况</h2><span class="chip-mini" id="rvTaskChip">—</span></div>
          <div class="bars" id="rvTaskBars"></div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-head"><h2>科研进展</h2></div>
            <div id="rvResearch" class="kv-wrap"></div>
          </div>
          <div class="card">
            <div class="card-head"><h2>生活记录</h2></div>
            <div id="rvLife" class="kv-wrap"></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-head"><h2>阅读与思考</h2></div>
            <div id="rvReading" class="kv-wrap"></div>
          </div>
          <div class="card">
            <div class="card-head"><h2>习惯坚持</h2></div>
            <div id="rvHabit" class="kv-wrap"></div>
          </div>
        </div>
      </section>

    </div><!-- /scroll -->

    <!-- 悬浮快速记录 -->
    <button class="fab" id="fab" title="快速记录">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- 底部标签栏（移动端） -->
    <nav class="tabbar" id="tabbar">
      <button class="tab is-active" data-nav="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg><span>首页</span>
      </button>
      <button class="tab" data-nav="research">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 12h7M9 16h5"/></svg><span>科研</span>
      </button>
      <button class="tab" data-nav="life">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.35-7-9.5A3.5 3.5 0 0 1 12 8a3.5 3.5 0 0 1 7 2.5C19 15.65 12 20 12 20z"/></svg><span>生活</span>
      </button>
      <button class="tab" data-nav="review">
        <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 16V11M12.5 16V7M17 16v-6"/></svg><span>回顾</span>
      </button>
    </nav>

  </main>
</div>

<!-- 快速记录面板 -->
<div class="sheet-mask" id="quickMask">
  <div class="sheet" id="quickSheet">
    <div class="sheet-bar"></div>
    <div class="sheet-head">
      <h3>快速记录</h3>
      <button class="ghost-btn" id="quickClose">关闭</button>
    </div>
    <textarea id="quickText" class="quick-text" rows="4" placeholder="随手写下灵感、选题、一句话想法…"></textarea>
    <div class="quick-tags" id="quickTags">
      <button class="tag-btn is-active" data-qt="灵感">灵感</button>
      <button class="tag-btn" data-qt="选题">选题</button>
      <button class="tag-btn" data-qt="文献">文献</button>
      <button class="tag-btn" data-qt="生活">生活</button>
      <button class="tag-btn" data-qt="待办">待办</button>
    </div>
    <div class="sheet-actions">
      <button class="soft-btn soft-btn--quiet" id="quickToTask">存为今日任务</button>
      <button class="soft-btn soft-btn--solid" id="quickSave">存入收集箱</button>
    </div>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="ghost-btn" id="modalClose">关闭</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/papers.js"></script>
<script src="assets/feed.js"></script>
<script src="assets/translate.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
